<svg width="900" height="520" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowheadTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="900" height="520" fill="#FAF9F4"/>

  <!-- ===== top: phase flow interrupted by a crash ===== -->

  <!-- P4 implement (purple) -->
  <rect x="110" y="80" width="160" height="90" rx="14" fill="#E3E0F7"/>
  <text x="190" y="136" font-family="Noto Sans SC, serif" font-size="20" fill="#4C45A8" text-anchor="middle" font-weight="bold">P4 实现</text>

  <!-- connector P4 -> gate -->
  <line x1="270" y1="125" x2="348" y2="125" stroke="#444441" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- gate (teal) -->
  <rect x="370" y="80" width="160" height="90" rx="14" fill="#9FE1CB"/>
  <path d="M402 128 L423 149 L458 107" fill="none" stroke="#085041" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- lightning bolt strikes the flow (coral) -->
  <path d="M322 24 L306 62 L330 62 L310 102" fill="none" stroke="#D85A30" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="342" y="42" font-family="Noto Sans SC, serif" font-size="20" fill="#D85A30" letter-spacing="1">会话终止</text>

  <!-- connector gate -> P5 -->
  <line x1="530" y1="125" x2="608" y2="125" stroke="#888780" stroke-width="2" stroke-dasharray="4 6" marker-end="url(#arrowhead)"/>

  <!-- P5 verify (gray, pending) -->
  <rect x="630" y="80" width="160" height="90" rx="14" fill="#D3D1C7"/>
  <text x="710" y="136" font-family="Noto Sans SC, serif" font-size="20" fill="#444441" text-anchor="middle" font-weight="bold">P5 验证</text>

  <!-- ===== bottom: state file card survives ===== -->

  <rect x="110" y="250" width="680" height="180" rx="16" fill="#FFFFFF" stroke="#1D9E75" stroke-width="2"/>

  <!-- header pill -->
  <rect x="140" y="276" width="170" height="34" rx="17" fill="#9FE1CB"/>
  <text x="225" y="299" font-family="Noto Sans SC, serif" font-size="17" fill="#085041" text-anchor="middle" font-weight="bold">active-tasks.md</text>
  <text x="340" y="300" font-family="Noto Sans SC, serif" font-size="18" fill="#1A1A18">已纳入版本控制</text>

  <!-- markdown-ish content lines -->
  <rect x="140" y="330" width="420" height="12" rx="6" fill="#D3D1C7"/>
  <rect x="140" y="352" width="360" height="12" rx="6" fill="#D3D1C7"/>
  <rect x="140" y="374" width="300" height="12" rx="6" fill="#D3D1C7"/>

  <!-- persisted phase indicator -->
  <circle cx="620" cy="342" r="19" fill="#9FE1CB"/>
  <path d="M609 344 L620 355 L633 331" fill="none" stroke="#085041" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="620" y="400" font-family="Noto Sans SC, serif" font-size="19" fill="#085041" text-anchor="middle" font-weight="bold">phase 已保存</text>

  <!-- resume arrow from card up to P5 -->
  <line x1="560" y1="250" x2="700" y2="172" stroke="#1D9E75" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arrowheadTeal)"/>
  <text x="592" y="220" font-family="Noto Sans SC, serif" font-size="18" fill="#1D9E75">从保存的状态恢复</text>

</svg>
