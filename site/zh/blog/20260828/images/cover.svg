<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="630" fill="#FAF9F4"/>

  <!-- thin top rule for editorial feel -->
  <line x1="80" y1="80" x2="1120" y2="80" stroke="#D3D1C7" stroke-width="1"/>

  <!-- kicker -->
  <text x="80" y="58" font-family="Noto Sans SC, serif" font-size="22" fill="#888780" letter-spacing="2">AGATEON — ORCHESTRATION PROTOCOL</text>

  <!-- ===== the ladder of evidence: 5 ascending rungs ===== -->

  <!-- Step 1 (weakest): self-report, dashed coral -->
  <rect x="170" y="410" width="190" height="56" rx="12" fill="#F5C4B3" stroke="#D85A30" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="265" y="446" font-family="Noto Sans SC, serif" font-size="24" fill="#712B13" text-anchor="middle">自我报告</text>
  <!-- question mark above rung 1 -->
  <circle cx="150" cy="414" r="17" fill="#D85A30"/>
  <text x="150" y="421" font-family="Noto Sans SC, serif" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="bold">?</text>

  <!-- agent feeding the dashed self-report line -->
  <rect x="30" y="372" width="100" height="100" rx="18" fill="#E3E0F7"/>
  <circle cx="80" cy="402" r="14" fill="#4C45A8"/>
  <rect x="64" y="428" width="32" height="30" rx="9" fill="#4C45A8"/>
  <text x="80" y="504" font-family="Noto Sans SC, serif" font-size="22" fill="#4C45A8" text-anchor="middle" letter-spacing="1">AGENT</text>
  <line x1="130" y1="425" x2="170" y2="438" stroke="#D85A30" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowhead)"/>

  <!-- Step 2: artifacts -->
  <rect x="360" y="345" width="190" height="56" rx="12" fill="#D3D1C7"/>
  <text x="455" y="381" font-family="Noto Sans SC, serif" font-size="24" fill="#444441" text-anchor="middle">产出物</text>

  <!-- Step 3: tool verdicts -->
  <rect x="550" y="280" width="190" height="56" rx="12" fill="#9FE1CB"/>
  <text x="645" y="316" font-family="Noto Sans SC, serif" font-size="24" fill="#085041" text-anchor="middle">工具判定结果</text>

  <!-- Step 4: git history -->
  <rect x="740" y="215" width="190" height="56" rx="12" fill="#9FE1CB"/>
  <text x="835" y="251" font-family="Noto Sans SC, serif" font-size="24" fill="#085041" text-anchor="middle">git 历史记录</text>

  <!-- Step 5 (strongest): independent review, checkmark -->
  <rect x="930" y="150" width="190" height="56" rx="12" fill="#E3E0F7"/>
  <text x="1025" y="186" font-family="Noto Sans SC, serif" font-size="24" fill="#4C45A8" text-anchor="middle">独立</text>
  <circle cx="1145" cy="178" r="17" fill="#1D9E75"/>
  <path d="M1138 178 L1143 184 L1153 171" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- "stronger" direction hint on the left edge -->
  <path d="M44 300 L52 292 M44 300 L52 308" stroke="#C9C6BA" stroke-width="2" stroke-linecap="round"/>

  <!-- title -->
  <text x="80" y="532" font-family="Noto Sans SC, serif" font-size="44" fill="#1A1A18" font-weight="bold">任务是真的完成了，还是仅仅</text>
  <text x="80" y="584" font-family="Noto Sans SC, serif" font-size="44" fill="#1D9E75" font-weight="bold">看起来完成了？</text>
  <text x="455" y="584" font-family="Noto Sans SC, serif" font-size="24" fill="#888780">AI-agent 工作证据链</text>

</svg>
