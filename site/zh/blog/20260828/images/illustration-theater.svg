<svg width="900" height="520" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="900" height="520" fill="#FAF9F4"/>

  <!-- thin top rule + kicker -->
  <line x1="70" y1="64" x2="830" y2="64" stroke="#D3D1C7" stroke-width="1"/>
  <text x="70" y="44" font-family="Noto Sans SC, serif" font-size="16" fill="#888780" letter-spacing="2">AGATEON — ORCHESTRATION PROTOCOL</text>

  <!-- agent node (left) -->
  <rect x="70" y="150" width="130" height="130" rx="20" fill="#E3E0F7"/>
  <circle cx="135" cy="182" r="15" fill="#4C45A8"/>
  <rect x="119" y="208" width="32" height="30" rx="9" fill="#4C45A8"/>
  <text x="135" y="310" font-family="Noto Sans SC, serif" font-size="24" fill="#4C45A8" text-anchor="middle" letter-spacing="1">AGENT</text>

  <!-- report document (center) -->
  <rect x="280" y="140" width="190" height="150" rx="10" fill="#FFFFFF" stroke="#C9C6BA" stroke-width="2"/>
  <line x1="300" y1="180" x2="450" y2="180" stroke="#D3D1C7" stroke-width="6" stroke-linecap="round"/>
  <line x1="300" y1="202" x2="440" y2="202" stroke="#D3D1C7" stroke-width="6" stroke-linecap="round"/>
  <line x1="300" y1="224" x2="450" y2="224" stroke="#D3D1C7" stroke-width="6" stroke-linecap="round"/>
  <text x="375" y="332" font-family="Noto Sans SC, serif" font-size="24" fill="#D85A30" text-anchor="middle">“看起来做完了”</text>

  <!-- dashed self-report lines (coral) -->
  <line x1="200" y1="215" x2="280" y2="215" stroke="#D85A30" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowhead2)"/>
  <line x1="470" y1="215" x2="540" y2="215" stroke="#D85A30" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowhead2)"/>

  <!-- gate node (right) -->
  <rect x="540" y="140" width="150" height="150" rx="20" fill="#9FE1CB"/>
  <path d="M575 215 L595 235 L655 185" fill="none" stroke="#085041" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="615" y="320" font-family="Noto Sans SC, serif" font-size="24" fill="#085041" text-anchor="middle" letter-spacing="1">GATE</text>

  <!-- PASS stamp beneath gate -->
  <rect x="565" y="345" width="110" height="46" rx="10" fill="#9FE1CB" stroke="#085041" stroke-width="2"/>
  <text x="620" y="375" font-family="Noto Sans SC, serif" font-size="30" fill="#085041" text-anchor="middle" font-weight="bold">PASS</text>

  <!-- caption -->
  <text x="70" y="470" font-family="Noto Sans SC, serif" font-size="22" fill="#1A1A18">Gate 在 agent 自己的报告上盖了个 PASS。</text>

</svg>
