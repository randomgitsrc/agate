<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="630" fill="#FAF9F4"/>

  <!-- thin top rule for editorial feel -->
  <line x1="80" y1="80" x2="1120" y2="80" stroke="#D3D1C7" stroke-width="1"/>

  <!-- kicker -->
  <text x="80" y="60" font-family="Georgia, serif" font-size="22" fill="#888780" letter-spacing="2">AGATEON &#8212; ORCHESTRATION PROTOCOL</text>

  <!-- ===== middle visual: agent -> gate (with evidence) -> next phase ===== -->

  <!-- agent node (purple) -->
  <rect x="100" y="108" width="130" height="130" rx="20" fill="#E3E0F7"/>
  <!-- agent glyph: head circle + body -->
  <circle cx="165" cy="152" r="18" fill="#4C45A8"/>
  <rect x="147" y="184" width="36" height="34" rx="10" fill="#4C45A8"/>
  <text x="165" y="268" font-family="Georgia, serif" font-size="28" fill="#4C45A8" text-anchor="middle" letter-spacing="1">AGENT</text>

  <!-- output arrow to gate -->
  <line x1="230" y1="173" x2="308" y2="173" stroke="#444441" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- gate node (teal) -->
  <rect x="320" y="108" width="130" height="130" rx="20" fill="#9FE1CB"/>
  <path d="M354 158 L375 179 L410 137" fill="none" stroke="#085041" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="385" y="268" font-family="Georgia, serif" font-size="28" fill="#085041" text-anchor="middle" letter-spacing="1">GATE</text>

  <!-- gate pass arrow to next phase -->
  <line x1="450" y1="173" x2="528" y2="173" stroke="#444441" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="540" y="108" width="130" height="130" rx="20" fill="#D3D1C7"/>
  <text x="605" y="181" font-family="Georgia, serif" font-size="28" fill="#444441" text-anchor="middle" letter-spacing="1">NEXT</text>

  <!-- evidence pills beneath the gate -->
  <rect x="275" y="330" width="130" height="42" rx="21" fill="#F5C4B3"/>
  <text x="340" y="358" font-family="Georgia, serif" font-size="20" fill="#712B13" text-anchor="middle">git log</text>

  <rect x="415" y="330" width="130" height="42" rx="21" fill="#F5C4B3"/>
  <text x="480" y="358" font-family="Georgia, serif" font-size="20" fill="#712B13" text-anchor="middle">exit code</text>

  <rect x="325" y="384" width="170" height="42" rx="21" fill="#F5C4B3"/>
  <text x="410" y="412" font-family="Georgia, serif" font-size="20" fill="#712B13" text-anchor="middle">test suite</text>

  <!-- title -->
  <text x="80" y="478" font-family="Georgia, serif" font-size="46" fill="#1A1A18" font-weight="bold">Don't trust the agent.</text>
  <text x="80" y="530" font-family="Georgia, serif" font-size="46" fill="#1D9E75" font-weight="bold">Gate the output.</text>

</svg>
