name: Protocol Tests

# docs-only PR 与 required checks 的修复史（两次实证，勿再想当然）：
#
# ① 2026-08-25 PR #194：原 paths-ignore 让 docs-only PR 跳过整个 workflow → 6 个 required
#    checks（pytest×2/shellcheck×2/consistency/gate-backstop）无 check-run → 分支保护按
#    "pending" 处理 → 永久 BLOCK（PR #193 实证 "6 of 6 required status checks are expected"）。
#    修法：去 paths-ignore，改 detect-docs-only job + 全量 job 用 job 级 if 条件跳过。
#
# ② 2026-08-25 PR #203 实证①的修法也没解决：job 级 if 跳过 → check conclusion="skipped"，
#    而 GitHub 分支保护对 skipped 的 required check 同样 BLOCK（mergeable_state="blocked"）。
#    此前注释声称"skipped 视为成功"系错误假设，从未被真实 docs-only PR 验证过。
#
# ③ 本次修法（当前实现）：4 个 required job（pytest/shellcheck/consistency/gate-backstop）
#    不再有 job 级 if——job 始终运行，把 docs-only 判断内嵌进各检查 run step 开头
#    （docs_only=true 时 echo + exit 0 → job conclusion="success"），分支保护即满足。
#    platform-scan/ruff 非 required，保留 job 级 if 跳过（不阻塞合并）。
#    代价：docs-only 时各 job 仍会走 checkout/setup（约 20-40s），换取 required check success。
#
# 协议定义：docs-only = 仅改动 docs 清单内路径（含 site/ 产品 Web 层，见 detect-docs-only 的
# NON_DOCS 过滤）；workflow 自身改动不算 docs-only（跑全量）。
#
# 2026-08-25 pytest 优化（实测 47.8s/16核 vs 165.7s 串行，3.5x 提速，1238 passed 无 flaky）：
#   - 删除 xdist Timing Observation 步骤（BDD-15/M23 观测目的已达，continue-on-error 纯浪费 1m13s）
#   - 全量测试改 `-n auto`（xdist 并行）作为门禁；保留 --reruns 1（TAG0023 RM-AG0044 flaky 兜底）
#   - 风险：RM-AG0041(basetemp)/RM-AG0044(git 短 hash) 环境敏感测试在并发下的稳定性已实测验证

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # docs-only 判定（取代原 paths-ignore）：计算本次变更是否纯 docs 清单内路径。
  # 输出 docs_only 供全量 job 的条件跳过使用；任何判定异常（空/非法 SHA、merge-base 失败）
  # 一律保守回退 docs_only=false（跑全量，fail-closed）。
  detect-docs-only:
    name: detect-docs-only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect docs-only changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          docs_only=false
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"; HEAD="$PR_HEAD"
          elif [ "$EVENT_NAME" = "push" ]; then
            BASE="$PUSH_BEFORE"; HEAD="$PUSH_AFTER"
          else
            BASE=""; HEAD=""
          fi
          if [ -n "$BASE" ] && [ -n "$HEAD" ] && [ "$BASE" != "$HEAD" ]; then
            MERGE_BASE=$(git merge-base "$BASE" "$HEAD" 2>/dev/null || true)
            if [ -n "$MERGE_BASE" ]; then
              CHANGED=$(git diff --name-only "$MERGE_BASE" "$HEAD" || true)
              # 纯 docs 判定：与历史 paths-ignore 清单一致（docs/roadmap/debt/archived/README/site 等）。
              # site/ 是产品 Web 层（VitePress 站点），在协议 gate 治理之外，改动等同 docs-only。
              # workflow 自身改动（.github/workflows/protocol-tests.yml 等）不在清单 → 视为非 docs-only。
              NON_DOCS=$(printf '%s\n' "$CHANGED" | grep -vE '^(agate-workspace/roadmap/|agate-workspace/debt/|archived/|docs/|site/|HANDOFF-[^/]*\.md$|FIX-[^/]*\.md$|README\.md$|README\.zh-CN\.md$|CHANGELOG\.md$|NOTICES\.md$|LICENSE$|\.github/workflows/docs-check\.yml$)' || true)
              if [ -z "$NON_DOCS" ] && [ -n "$CHANGED" ]; then
                docs_only=true
              fi
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  pytest:
    needs: detect-docs-only
    name: pytest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install pyyaml pytest
      - name: Install pytest-rerunfailures + pytest-xdist (Linux, flaky 自动重跑 1 次 + 并行)
        if: runner.os == 'Linux'
        run: pip install pytest-rerunfailures pytest-xdist
      - name: Run Full Test Suite (Linux, 全量, xdist 并行)
        if: runner.os == 'Linux'
        run: |
          if [ "${{ needs.detect-docs-only.outputs.docs_only }}" = "true" ]; then
            echo "docs-only PR: pytest skipped (fast-pass)"
            exit 0
          fi
          python3 -m pytest agate/tests/ --reruns 1 -n auto
        env:
          PYTHONIOENCODING: utf-8
      - name: Run Windows Smoke (marker 代表子集)
        if: runner.os == 'Windows'
        run: |
          if [ "${{ needs.detect-docs-only.outputs.docs_only }}" = "true" ]; then
            echo "docs-only PR: pytest skipped (fast-pass)"
            exit 0
          fi
          # TAG0011 决策：check-windows-smoke.sh 退役（v0.47.0，P1 §6.2），Windows 冒烟改由
          # @pytest.mark.windows_smoke marker 承接——平台敏感用例（cp1252/CRLF/symlink/py_path/
          # 复制模式/编码/无bc/ln 退化等）逐用例打标，代表集即清单。
          # 功能正确性由 Linux 全量 pytest 保证；Windows 只验证每条平台敏感机制代表用例跑通。
          python -m pytest agate/tests/ -m windows_smoke
        env:
          PYTHONIOENCODING: utf-8

  platform-scan:
    needs: detect-docs-only
    if: needs.detect-docs-only.outputs.docs_only == 'false'
    name: platform-scan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Run platform-assumptions scan (Linux, 阻断 gate)
        if: runner.os == 'Linux'
        run: python3 agate/scripts/check-platform-assumptions.py
      - name: Run platform-assumptions scan (Windows, 等价性证明)
        if: runner.os == 'Windows'
        env:
          PYTHONIOENCODING: utf-8
        run: python agate/scripts/check-platform-assumptions.py

  shellcheck:
    needs: detect-docs-only
    name: shellcheck
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y shellcheck
      - name: Install shellcheck (Windows)
        if: runner.os == 'Windows'
        run: |
          curl -sSLo shellcheck.zip https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.zip
          unzip -q shellcheck.zip -d "$GITHUB_WORKSPACE/shellcheck"
          echo "$GITHUB_WORKSPACE/shellcheck" >> $GITHUB_PATH
      - name: Run shellcheck (Linux, 3 hook 薄壳)
        if: runner.os == 'Linux'
        run: |
          if [ "${{ needs.detect-docs-only.outputs.docs_only }}" = "true" ]; then
            echo "docs-only PR: shellcheck skipped (fast-pass)"
            exit 0
          fi
          shellcheck -S warning agate/scripts/pre-commit-gate.sh agate/scripts/commit-msg-self-gate.sh agate/scripts/pre-push-gate.sh
      - name: Run shellcheck (Windows, 3 hook 薄壳)
        if: runner.os == 'Windows'
        run: |
          if [ "${{ needs.detect-docs-only.outputs.docs_only }}" = "true" ]; then
            echo "docs-only PR: shellcheck skipped (fast-pass)"
            exit 0
          fi
          shellcheck.exe -S warning agate/scripts/pre-commit-gate.sh agate/scripts/commit-msg-self-gate.sh agate/scripts/pre-push-gate.sh

  ruff:
    needs: detect-docs-only
    if: needs.detect-docs-only.outputs.docs_only == 'false'
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run ruff check (agate/, 项目根 pyproject.toml)
        # RM-AG0037: ruff 锁 0.16.4，与本地开发环境 ~/.venvs/agate-dev/bin/ruff 对齐（BDD-2 对齐语义实体化）
        run: pip install ruff==0.16.4 && ruff check agate/

  consistency:
    needs: detect-docs-only
    name: consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Run consistency check (Linux)
        run: |
          if [ "${{ needs.detect-docs-only.outputs.docs_only }}" = "true" ]; then
            echo "docs-only PR: consistency skipped (fast-pass, docs-check.yml 已跑 --strict-errors-only)"
            exit 0
          fi
          python3 agate/scripts/check-protocol-consistency.py
      - name: Run structure consistency check (TAG0021 M2, Linux)
        run: |
          if [ "${{ needs.detect-docs-only.outputs.docs_only }}" = "true" ]; then
            echo "docs-only PR: structure consistency skipped (fast-pass)"
            exit 0
          fi
          python3 agate/scripts/check-structure-consistency.py

  gate-backstop:
    needs: detect-docs-only
    name: gate-backstop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Run gate backstop check (Linux)
        run: |
          if [ "${{ needs.detect-docs-only.outputs.docs_only }}" = "true" ]; then
            echo "docs-only PR: gate-backstop skipped (fast-pass)"
            exit 0
          fi
          python3 agate/scripts/ci-gate-backstop.py
