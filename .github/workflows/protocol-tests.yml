name: Protocol Tests

on: [push, pull_request]

jobs:
  bats:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y bats
          pip install pyyaml
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          git clone --depth 1 --branch v1.10.0 https://github.com/bats-core/bats-core.git bats
          echo "$GITHUB_WORKSPACE/bats/bin" >> $GITHUB_PATH
          pip install pyyaml
      - name: Run Unit Tests
        run: bats agate/tests/unit/
      - name: Run Regression Tests
        run: bats agate/tests/regression/
      - name: Run Integration Tests
        run: bats agate/tests/integration/
      - name: Self-check framework
        run: bats agate/tests/sanity.bats

  shellcheck:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y shellcheck
      - name: Install shellcheck (Windows)
        if: runner.os == 'Windows'
        run: |
          curl -sSLo shellcheck.zip https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.zip
          unzip -q shellcheck.zip -d "$GITHUB_WORKSPACE/shellcheck"
          echo "$GITHUB_WORKSPACE/shellcheck" >> $GITHUB_PATH
      - name: Run shellcheck (Linux)
        if: runner.os == 'Linux'
        run: shellcheck -S warning agate/scripts/*.sh
      - name: Run shellcheck (Windows)
        if: runner.os == 'Windows'
        run: shellcheck.exe -S warning agate/scripts/*.sh

  consistency:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Run consistency check (Linux)
        if: runner.os == 'Linux'
        run: python3 agate/scripts/check-protocol-consistency.py
      - name: Run consistency check (Windows)
        if: runner.os == 'Windows'
        env:
          PYTHONIOENCODING: utf-8
        run: python agate/scripts/check-protocol-consistency.py

  gate-backstop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Run gate backstop check (Linux)
        if: runner.os == 'Linux'
        run: python3 agate/scripts/ci-gate-backstop.py
      - name: Run gate backstop check (Windows)
        if: runner.os == 'Windows'
        env:
          PYTHONIOENCODING: utf-8
        run: python agate/scripts/ci-gate-backstop.py
