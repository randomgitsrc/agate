name: Protocol Tests

on: [push, pull_request]

jobs:
  pytest:
    name: pytest
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install pyyaml pytest
      - name: Run Full Test Suite (Linux, 全量)
        if: runner.os == 'Linux'
        run: python3 -m pytest agate/tests/
        env:
          PYTHONIOENCODING: utf-8
      - name: Run Windows Smoke (marker 代表子集)
        if: runner.os == 'Windows'
        run: |
          # TAG0011 决策：check-windows-smoke.sh 退役（v0.47.0，P1 §6.2），Windows 冒烟改由
          # @pytest.mark.windows_smoke marker 承接——平台敏感用例（cp1252/CRLF/symlink/py_path/
          # 复制模式/编码/无bc/ln 退化等）逐用例打标，代表集即清单。
          # 功能正确性由 Linux 全量 pytest 保证；Windows 只验证每条平台敏感机制代表用例跑通。
          python -m pytest agate/tests/ -m windows_smoke
        env:
          PYTHONIOENCODING: utf-8

  platform-scan:
    name: platform-scan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Run platform-assumptions scan (Linux, 阻断 gate)
        if: runner.os == 'Linux'
        run: python3 agate/scripts/check-platform-assumptions.py
      - name: Run platform-assumptions scan (Windows, 等价性证明)
        if: runner.os == 'Windows'
        env:
          PYTHONIOENCODING: utf-8
        run: python agate/scripts/check-platform-assumptions.py

  shellcheck:
    name: shellcheck
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y shellcheck
      - name: Install shellcheck (Windows)
        if: runner.os == 'Windows'
        run: |
          curl -sSLo shellcheck.zip https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.zip
          unzip -q shellcheck.zip -d "$GITHUB_WORKSPACE/shellcheck"
          echo "$GITHUB_WORKSPACE/shellcheck" >> $GITHUB_PATH
      - name: Run shellcheck (Linux, 3 hook 薄壳)
        if: runner.os == 'Linux'
        run: shellcheck -S warning agate/scripts/pre-commit-gate.sh agate/scripts/commit-msg-self-gate.sh agate/scripts/pre-push-gate.sh
      - name: Run shellcheck (Windows, 3 hook 薄壳)
        if: runner.os == 'Windows'
        run: shellcheck.exe -S warning agate/scripts/pre-commit-gate.sh agate/scripts/commit-msg-self-gate.sh agate/scripts/pre-push-gate.sh

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run ruff check (agate/, 项目根 pyproject.toml)
        run: pip install ruff && ruff check agate/

  consistency:
    name: consistency
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Run consistency check (Linux)
        if: runner.os == 'Linux'
        run: python3 agate/scripts/check-protocol-consistency.py
      - name: Run consistency check (Windows)
        if: runner.os == 'Windows'
        env:
          PYTHONIOENCODING: utf-8
        run: python agate/scripts/check-protocol-consistency.py

  gate-backstop:
    name: gate-backstop
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Run gate backstop check (Linux)
        if: runner.os == 'Linux'
        run: python3 agate/scripts/ci-gate-backstop.py
      - name: Run gate backstop check (Windows)
        if: runner.os == 'Windows'
        env:
          PYTHONIOENCODING: utf-8
        run: python agate/scripts/ci-gate-backstop.py
