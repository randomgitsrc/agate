name: Protocol Tests

on: [push, pull_request]

jobs:
  bats:
    name: bats
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y bats
          pip install pyyaml
      - name: Install bats (Windows)
        if: runner.os == 'Windows'
        run: |
          git clone --depth 1 --branch v1.10.0 https://github.com/bats-core/bats-core.git bats
          echo "$GITHUB_WORKSPACE/bats/bin" >> $GITHUB_PATH
      - name: Install pyyaml (Windows)
        if: runner.os == 'Windows'
        run: |
          pip install pyyaml
      - name: Run Unit Tests (Linux, serial)
        if: runner.os == 'Linux'
        run: bats agate/tests/unit/
        env:
          PYTHONIOENCODING: utf-8
      - name: Run Scanner Behavior Tests (Linux, 全量)
        if: runner.os == 'Linux'
        run: bats agate/tests/scripts/check-platform-assumptions.bats
        env:
          PYTHONIOENCODING: utf-8
      - name: Run Regression Tests (Linux, 全量)
        if: runner.os == 'Linux'
        run: bats agate/tests/regression/
        env:
          PYTHONIOENCODING: utf-8
      - name: Run Integration Tests (Linux, 全量)
        if: runner.os == 'Linux'
        run: bats agate/tests/integration/
        env:
          PYTHONIOENCODING: utf-8
      - name: Self-check framework (Linux)
        if: runner.os == 'Linux'
        run: bats agate/tests/sanity.bats
        env:
          PYTHONIOENCODING: utf-8
      - name: Run Windows Smoke (技术路线代表子集, parallel)
        if: runner.os == 'Windows'
        run: |
          # TAG0009 v0.45 决策：Windows bats 从全量（747 用例 ~11.5 分钟，线性增长阻塞 CI）
          # 降级为"技术路线冒烟"——check-windows-smoke.sh 对每个 .bats 文件选第 1 个用例 +
          # 名称含平台敏感关键词的用例（约 60 文件代表子集，xargs -P 4 并行，~2 分钟）。
          # 功能正确性由 Linux 全量 bats 保证；Windows 只验证每条平台敏感机制
          # （py_path/shim/cp1252/CRLF/symlink/盘符路径等）代表用例跑通 → 技术路线成立。
          bash agate/tests/scripts/check-windows-smoke.sh
        env:
          PYTHONIOENCODING: utf-8

  platform-scan:
    name: platform-scan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Run platform-assumptions scan (Linux, 阻断 gate)
        if: runner.os == 'Linux'
        run: bash agate/scripts/check-platform-assumptions.sh
      - name: Run platform-assumptions scan (Windows, 等价性证明)
        if: runner.os == 'Windows'
        run: bash agate/scripts/check-platform-assumptions.sh

  shellcheck:
    name: shellcheck
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y shellcheck
      - name: Install shellcheck (Windows)
        if: runner.os == 'Windows'
        run: |
          curl -sSLo shellcheck.zip https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.zip
          unzip -q shellcheck.zip -d "$GITHUB_WORKSPACE/shellcheck"
          echo "$GITHUB_WORKSPACE/shellcheck" >> $GITHUB_PATH
      - name: Run shellcheck (Linux)
        if: runner.os == 'Linux'
        run: shellcheck -S warning agate/scripts/*.sh
      - name: Run shellcheck (Windows)
        if: runner.os == 'Windows'
        run: shellcheck.exe -S warning agate/scripts/*.sh

  consistency:
    name: consistency
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Run consistency check (Linux)
        if: runner.os == 'Linux'
        run: python3 agate/scripts/check-protocol-consistency.py
      - name: Run consistency check (Windows)
        if: runner.os == 'Windows'
        env:
          PYTHONIOENCODING: utf-8
        run: python agate/scripts/check-protocol-consistency.py

  gate-backstop:
    name: gate-backstop
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Run gate backstop check (Linux)
        if: runner.os == 'Linux'
        run: python3 agate/scripts/ci-gate-backstop.py
      - name: Run gate backstop check (Windows)
        if: runner.os == 'Windows'
        env:
          PYTHONIOENCODING: utf-8
        run: python agate/scripts/ci-gate-backstop.py
